version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # v4 requires a config/CSS migration; bump manually
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # svelte-check only supports typescript 5/6
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
